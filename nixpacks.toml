[phases.setup]
# nodejs_20 includes npm; no need to list npm separately
nixPkgs = ["nodejs_20"]

[phases.install]
# Explicitly install devDependencies needed for TypeScript build
cmds = ["npm install --include=dev"]
env = { NPM_CONFIG_PRODUCTION = "false", NODE_ENV = "development" }

[phases.build]
cmds = ["npm run build:server"]

[start]
# build already ran in build phase; just start the compiled server
cmd = "npm run start:server"
